workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create assets folders
        script: |
          mkdir -p assets/images
          mkdir -p assets/data
          mkdir -p assets/fonts
      - name: Build
        script: |
          flutter clean
          flutter pub get
          flutter build appbundle --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/bundle/debug/app-debug.aab