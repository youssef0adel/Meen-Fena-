workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create required directories and icons
        script: |
          mkdir -p assets/images
          mkdir -p assets/data
          mkdir -p assets/fonts
          
          # إنشاء مجلدات الأيقونات
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          
          # إنشاء أيقونة PNG صغيرة باستخدام Base64
          python3 << 'PYEOF'
          import base64, os

          # 1x1 بكسل أحمر PNG مشفر
          tiny_png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg=="
          )

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}/ic_launcher.png'
              with open(path, 'wb') as f:
                  f.write(tiny_png)
              print(f'Created: {path}')

          print('Icons done!')
          PYEOF
      
      - name: Build app
        script: |
          flutter clean
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk