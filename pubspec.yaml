name: meen_fena
description: "مين فينا؟ (Who Among Us?) - لعبة استنتاج اجتماعي مصرية"
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # Core
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # UI & Animation
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9
  
  # Utilities
  uuid: ^4.2.1
  collection: ^1.18.0
  
  # Network
  web_socket_channel: ^2.4.0
  
  # Audio (اختياري - ممكن تشيله لو بيعمل مشاكل)
  audioplayers: ^5.2.1
  
  # Localization - بدون تحديد إصدار intl يدوياً
  flutter_localizations:
    sdk: flutter
  # intl مش محتاج تحدده - هيتحمل تلقائي من flutter_localizations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/evidence/
    - assets/images/icons/
    - assets/images/egyptian/
    - assets/sounds/sfx/
    - assets/sounds/music/
    - assets/data/cases/
    - assets/data/config/
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
          
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo_splash.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/logo/logo_foreground.png"    
  